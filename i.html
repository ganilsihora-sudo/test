<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Matching Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #4ecca3;
        }

        .score-board {
            margin-bottom: 20px;
            font-size: 16px;
            color: #cccccc;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1;
            background-color: #393e46;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .card.flip {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 32px;
        }

        .card-front {
            background: #00adb5;
            color: white;
            font-size: 20px;
        }

        .card-back {
            background: #eeeeee;
            transform: rotateY(180deg);
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4ecca3;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #45b08c;
        }

        /* Custom Win Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #252830;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #393e46;
            animation: popUp 0.3s ease-in-out;
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            color: #4ecca3;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .modal-content p {
            margin-bottom: 20px;
            color: #cccccc;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Memory Match</h1>
        <div class="score-board">Moves: <span id="moves">0</span></div>
        <div class="grid" id="gameGrid"></div>
        <button class="btn" id="restartBtn">Restart Game</button>
    </div>

    <!-- Custom Win Popup Modal -->
    <div id="winModal" class="modal">
        <div class="modal-content">
            <h2>You Won! 🎉</h2>
            <p>Completed in <span id="finalMoves">0</span> moves.</p>
            <button class="btn" id="modalRestartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const emojis = ['🍎', '🍌', '🍇', '🍉', '🍓', '🍒', '🍍', '🥝'];
        let cardsArray = [...emojis, ...emojis];

        const gameGrid = document.getElementById('gameGrid');
        const movesDisplay = document.getElementById('moves');
        const restartBtn = document.getElementById('restartBtn');
        const winModal = document.getElementById('winModal');
        const finalMoves = document.getElementById('finalMoves');
        const modalRestartBtn = document.getElementById('modalRestartBtn');

        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;

        function initGame() {
            gameGrid.innerHTML = '';
            winModal.style.display = 'none'; // मोडल छिपाएं
            moves = 0;
            matchedPairs = 0;
            movesDisplay.textContent = moves;
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;

            cardsArray.sort(() => 0.5 - Math.random());

            cardsArray.forEach(emoji => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="card-face card-front">?</div>
                    <div class="card-face card-back">${emoji}</div>
                `;

                card.addEventListener('click', flipCard);
                gameGrid.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesDisplay.textContent = moves;

            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            matchedPairs++;
            resetBoard();

            if (matchedPairs === emojis.length) {
                setTimeout(() => {
                    finalMoves.textContent = moves;
                    winModal.style.display = 'flex'; // कस्टम मोडल दिखाएं
                }, 400);
            }
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 800);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        restartBtn.addEventListener('click', initGame);
        modalRestartBtn.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
